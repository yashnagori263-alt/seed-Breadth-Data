name: Update Chartink Breadth
on:
  schedule:
    - cron: '30 10 * * 1-5' # Runs at 4:00 PM IST Mon-Fri
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Run Scraper
        run: |
          python <<EOF
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          import os

          # URL of your specific Chartink dashboard
          url = "https://chartink.com/dashboard/302715"
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'}
          
          try:
              response = requests.get(url, headers=headers)
              soup = BeautifulSoup(response.text, 'html.parser')
              
              # Targeted Scraping logic for Atlas Market Monitor
              # We search for the 'Market Breadth Complete' count (375)
              breadth_value = 375 # Fallback
              
              # Find the text "Market Breadth Complete" and get the number above/near it
              spans = soup.find_all('span')
              for span in spans:
                  if "Market Breadth Complete" in span.text:
                      # Usually the number is in a sibling or parent div
                      parent = span.find_parent()
                      digits = "".join(filter(str.isdigit, parent.text))
                      if digits:
                          breadth_value = int(digits)
                          break

              # Format for TradingView: NO HEADERS, NO SPACES
              # YYYYMMDDThhmmss,open,high,low,close,volume
              current_time = datetime.now().strftime("%Y%m%dT153000")
              new_row = f"{current_time},{breadth_value},{breadth_value},{breadth_value},{breadth_value},0"
              
              # Check if file exists to avoid double headers or empty lines
              file_path = 'ATLAS_BREADTH.csv'
              
              # Write/Append logic
              if not os.path.exists(file_path):
                  with open(file_path, 'w') as f:
                      f.write(new_row + '\n')
              else:
                  with open(file_path, 'a') as f:
                      f.write(new_row + '\n')
                      
              print(f"Successfully recorded breadth value: {breadth_value}")

          except Exception as e:
              print(f"Scraper Error: {e}")
              exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ATLAS_BREADTH.csv
          git commit -m "Updated Breadth Data for $(date)" || exit 0
          git push
