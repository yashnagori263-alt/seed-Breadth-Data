name: Update Chartink Breadth
on:
  schedule:
    - cron: '30 10 * * 1-5' # Runs at 4:00 PM IST Mon-Fri
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This explicitly tells GitHub the robot can write files
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Run Scraper
        run: |
          python <<EOF
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          import os

          url = "https://chartink.com/dashboard/302715"
          try:
              # Setting a header so Chartink doesn't block the 'Robot'
              headers = {'User-Agent': 'Mozilla/5.0'}
              response = requests.get(url, headers=headers)
              
              # For now, we use the 375 breadth value as a placeholder
              # Once the Action turns Green, I will give you the logic to scrape the live table!
              breadth_value = 375 
              
              current_time = datetime.now().strftime("%Y%m%dT153000")
              new_row = f"{current_time},{breadth_value},{breadth_value},{breadth_value},{breadth_value},0\n"
              
              with open('ATLAS_BREADTH.csv', 'a') as f:
                  f.write(new_row)
          except Exception as e:
              print(f"Error: {e}")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ATLAS_BREADTH.csv
          git commit -m "Daily Breadth Update" || exit 0
          git push
